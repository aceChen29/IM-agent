logging:
  level:
    dev.langchain4j.mcp: DEBUG

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen3.6-flash
        api-key: ${DASHSCOPE_API_KEY}

bigmodel:
  api-key: ${BIGMODEL_API_KEY}

spring:
  data:
    redis:
      database: ${IM_AGENT_REDIS_DATABASE:2}
      host: ${IM_AGENT_REDIS_HOST:127.0.0.1}
      port: ${IM_AGENT_REDIS_PORT:16381}
      password: ${IM_AGENT_REDIS_PASSWORD:}
      timeout: 30s
      lettuce:
        pool:
          min-idle: 4
          max-idle: 8
          max-active: 8
          max-wait: 5s

app:
  chat-memory:
    ttl-seconds: 3600
